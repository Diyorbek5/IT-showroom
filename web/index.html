<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT Showroom 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: to'liq ekranli 3D sahna, ustida chap-yuqori sarlavha, pastda ko'rinishlar paneli, o'ngda rejimlar. */
:root {
	--bg: #101113;
	--hud: rgba(18, 19, 22, 0.72);
	--hud-line: rgba(255, 255, 255, 0.09);
	--fg: #eceae5;
	--muted: #9c9a94;
	--accent: #d6ad62;   /* qandil oltini */
	--accent-ink: #1b1508;
	--font-ui: "Manrope", "Segoe UI", system-ui, sans-serif;
	--font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
	color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font-ui); overflow: hidden; }
#app { position: fixed; inset: 0; }
#app canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.hud { position: fixed; z-index: 5; background: var(--hud); border: 1px solid var(--hud-line); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border-radius: 12px; }
.title { top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px)); padding: 10px 14px; display: grid; gap: 2px; max-width: calc(100vw - 32px); }
.title h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; }
.floors { display: flex; gap: 4px; margin-block: 4px 2px; }
.floors button { padding: 7px 11px; }
.title .dims { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

.views { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); padding: 6px; display: flex; gap: 4px; max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none; }
.views::-webkit-scrollbar { display: none; }
.modes { right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 14px); padding: 6px; display: flex; flex-direction: column; gap: 4px; }

button { font: 600 12.5px/1 var(--font-ui); color: var(--fg); background: transparent; border: 0; border-radius: 8px; padding: 9px 12px; cursor: pointer; white-space: nowrap; transition: background 0.15s; }
button:hover { background: rgba(255, 255, 255, 0.08); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:disabled { opacity: 0.4; cursor: default; }
.modes button { text-align: left; }

.status { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); padding: 7px 11px; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.help { left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 14px 18px; text-align: center; pointer-events: none; }
.help kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--hud-line); border-radius: 4px; padding: 1px 5px; }

#loader { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--bg); transition: opacity 0.6s; }
#loader .box { display: grid; gap: 12px; width: min(320px, calc(100vw - 48px)); }
#loader .name { font-size: 18px; font-weight: 700; }
#loader .bar { height: 3px; background: var(--hud-line); border-radius: 2px; overflow: hidden; }
#loader .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
#loader .step { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

@media (max-width: 640px) {
	.modes { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); flex-direction: row; }
	.status { bottom: calc(env(safe-area-inset-bottom, 0px) + 124px); }
	.walk-btn { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>

<div class="hud title">
	<h1>IT Showroom</h1>
	<div class="floors" id="floors" role="group" aria-label="Qavatlar">
		<button type="button" data-floor="1" aria-pressed="true">1-qavat</button>
		<button type="button" data-floor="2" aria-pressed="false">2-qavat</button>
	</div>
	<div class="dims" id="floor-dims">7.30 × 8.75 m · shift 3.60 m · ~62 m²</div>
</div>

<div class="hud modes" role="group" aria-label="Rejimlar">
	<button id="btn-walk" class="walk-btn" type="button">Ichida yurish</button>
	<button id="btn-dims" type="button" aria-pressed="true">O'lchamlar</button>
	<button id="btn-light" type="button" aria-pressed="true">Chiroqlar</button>
	<button id="btn-pt" type="button" aria-pressed="false">Foto sifat</button>
</div>

<div class="hud views" role="group" aria-label="Ko'rinishlar" id="views"></div>
<div class="hud status" id="status" hidden></div>
<div class="hud help" id="help" hidden><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — yurish · sichqoncha — qarash · <kbd>Esc</kbd> — chiqish</div>

<div id="loader"><div class="box">
	<div class="name">IT Showroom</div>
	<div class="bar"><i id="load-bar"></i></div>
	<div class="step" id="load-step">Yuklanmoqda…</div>
</div></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
